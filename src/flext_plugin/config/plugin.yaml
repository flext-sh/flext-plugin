Plugin:
  version:
    default: "1.0.0"
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+)?$"
  validation:
    name:
      min_length: 3
      max_length: 100
      pattern: "^[a-zA-Z][a-zA-Z0-9_-]*$"
    description:
      max_length: 1000
    author:
      max_length: 200
    docstring:
      pattern: '"""([^"]+)"""'
  files:
    python_extension: ".py"
    yaml_extension: ".yaml"
    json_extension: ".json"
    toml_extension: ".toml"
    default_plugin_dir: "plugins"
    default_cache_dir: ".plugin_cache"
